services:
  db:
    image: mongo:latest
    container_name: mongodb_ids
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: always

  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: mqtt_broker
    ports:
      - "1883:1883"
    volumes:
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    command: |
      sh -c "mkdir -p /mosquitto/config && 
             echo 'listener 1883 0.0.0.0' > /mosquitto/config/mosquitto.conf && 
             echo 'allow_anonymous true' >> /mosquitto/config/mosquitto.conf && 
             echo 'persistence true' >> /mosquitto/config/mosquitto.conf && 
             echo 'persistence_location /mosquitto/data/' >> /mosquitto/config/mosquitto.conf && 
             /usr/sbin/mosquitto -c /mosquitto/config/mosquitto.conf"
    restart: always

  backend:
    build: ./backend
    container_name: esp32_backend
    depends_on:
      - db
      - mosquitto
    environment:
      - mongo_url=mongodb://admin:password123@db:27017/access_db?authSource=admin
      - MQTT_HOST=mqtt://mosquitto:1883
    ports:
      - "3000:3000"
    restart: always

  frontend:
    build: ./frontend
    container_name: react_web_app
    ports:
      - "80:80"
    environment:
      - VITE_API_URL=http://10.25.77.220:3000
    restart: always

volumes:
  mongo_data:
  mosquitto_data:
  mosquitto_log:
