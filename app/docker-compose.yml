services:
  db:
    image: mongo:latest
    container_name: mongodb_ids
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DB_NAME}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PASSWORD}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: always

  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: mqtt_broker
    ports:
      - "1883:1883"
    volumes:
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    command: |
      sh -c "mkdir -p /mosquitto/config && 
             echo 'listener 1883 0.0.0.0' > /mosquitto/config/mosquitto.conf && 
             echo 'allow_anonymous true' >> /mosquitto/config/mosquitto.conf && 
             echo 'persistence true' >> /mosquitto/config/mosquitto.conf && 
             echo 'persistence_location /mosquitto/data/' >> /mosquitto/config/mosquitto.conf && 
             /usr/sbin/mosquitto -c /mosquitto/config/mosquitto.conf"
    restart: always

  backend:
    build: ./backend
    container_name: esp32_backend
    env_file:
      - .env
    environment:
      # Важно: MONGO_URL в UPPERCASE, собирается из .env
      - MONGO_URL=mongodb://${DB_NAME}:${DB_PASSWORD}@db:27017/access_db?authSource=admin
      - MQTT_HOST=mqtt://mosquitto:1883
      - TZ=Europe/Moscow        # ВАЖНО: таймзона для смен
      - NODE_ENV=production
    depends_on:
      - db
      - mosquitto
    ports:
      - "3000:3000"
    restart: always

  frontend:
    build: 
      context: ./frontend
      # УБИРАЕМ args: VITE_API_URL отсюда
    container_name: react_web_app
    env_file:
      - .env
    # Пробрасываем IP хоста в переменную окружения контейнера
    environment:
      - HOST_IP=${IPV4}  # Придет из .env хоста при `docker compose up`
    ports:
      - "80:80"
    restart: always

volumes:
  mongo_data:
  mosquitto_data:
  mosquitto_log:
